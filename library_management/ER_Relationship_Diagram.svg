<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
<title id="title">College Library Management System - ER Relationship Diagram</title>
<desc id="desc">Entity relationship diagram showing Members and Books each having a one-to-many relationship with Issues.</desc>
<defs>
  <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#071b3a"/><stop offset="1" stop-color="#0b2d59"/></linearGradient>
  <linearGradient id="member" x2="0" y2="1"><stop stop-color="#174f91"/><stop offset="1" stop-color="#102c56"/></linearGradient>
  <linearGradient id="issue" x2="0" y2="1"><stop stop-color="#08795f"/><stop offset="1" stop-color="#073f3d"/></linearGradient>
  <linearGradient id="book" x2="0" y2="1"><stop stop-color="#a66c16"/><stop offset="1" stop-color="#573b13"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000814" flood-opacity=".35"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#dcecff"/></marker>
  <style>
    .heading{font:700 42px Arial,sans-serif;fill:#f7fbff;letter-spacing:1px}
    .entity{font:700 34px Arial,sans-serif;fill:#fff}
    .field{font:26px Arial,sans-serif;fill:#f3f7ff}
    .key{font-weight:700;fill:#fff}
    .relation{font:700 28px Arial,sans-serif;fill:#d9eaff}
    .note{font:25px Arial,sans-serif;fill:#f1f6ff}
  </style>
</defs>
<rect width="1600" height="1100" fill="url(#bg)"/>
<g opacity=".14" fill="none" stroke="#4e9ce8" stroke-width="3"><path d="M0 150 Q260 20 520 120 T1040 90 T1600 130"/><path d="M0 930 Q300 810 610 940 T1220 930 T1600 850"/><circle cx="1450" cy="180" r="105"/><circle cx="1450" cy="180" r="72"/><circle cx="1450" cy="180" r="38"/></g>
<g fill="#4e9ce8" opacity=".45"><circle cx="65" cy="65" r="5"/><circle cx="93" cy="65" r="5"/><circle cx="121" cy="65" r="5"/><circle cx="149" cy="65" r="5"/><circle cx="177" cy="65" r="5"/><circle cx="205" cy="65" r="5"/><circle cx="65" cy="93" r="5"/><circle cx="93" cy="93" r="5"/><circle cx="121" cy="93" r="5"/><circle cx="149" cy="93" r="5"/><circle cx="177" cy="93" r="5"/><circle cx="205" cy="93" r="5"/><circle cx="65" cy="121" r="5"/><circle cx="93" cy="121" r="5"/><circle cx="121" cy="121" r="5"/><circle cx="149" cy="121" r="5"/><circle cx="177" cy="121" r="5"/><circle cx="205" cy="121" r="5"/><circle cx="65" cy="149" r="5"/><circle cx="93" cy="149" r="5"/><circle cx="121" cy="149" r="5"/><circle cx="149" cy="149" r="5"/><circle cx="177" cy="149" r="5"/><circle cx="205" cy="149" r="5"/></g>
<rect x="95" y="70" width="1410" height="112" rx="28" fill="#09264e" stroke="#54b8ff" stroke-width="3" filter="url(#shadow)"/>
<text x="800" y="139" text-anchor="middle" class="heading">COLLEGE LIBRARY MANAGEMENT SYSTEM - ER DIAGRAM</text>

<!-- MEMBERS -->
<g filter="url(#shadow)">
<rect x="90" y="300" width="420" height="430" rx="22" fill="url(#member)" stroke="#55b7ff" stroke-width="4"/>
<path d="M112 300 H488 Q510 300 510 322 V390 H90 V322 Q90 300 112 300Z" fill="#2168ae"/>
<text x="300" y="357" text-anchor="middle" class="entity">MEMBERS</text>
</g>
<text x="125" y="450" class="field"><tspan class="key">PK</tspan><tspan dx="18">member_id : INT</tspan></text>
<text x="125" y="510" class="field">member_name : VARCHAR(100)</text>
<text x="125" y="570" class="field">member_type : ENUM</text>
<text x="125" y="630" class="field">joined_date : DATE</text>

<!-- ISSUES -->
<g filter="url(#shadow)">
<rect x="590" y="270" width="420" height="490" rx="22" fill="url(#issue)" stroke="#55e6b2" stroke-width="4"/>
<path d="M612 270 H988 Q1010 270 1010 292 V360 H590 V292 Q590 270 612 270Z" fill="#087b60"/>
<text x="800" y="328" text-anchor="middle" class="entity">ISSUES</text>
</g>
<text x="630" y="420" class="field"><tspan class="key">PK</tspan><tspan dx="18">issue_id : INT</tspan></text>
<text x="630" y="475" class="field"><tspan class="key">FK</tspan><tspan dx="18">member_id : INT</tspan></text>
<text x="630" y="530" class="field"><tspan class="key">FK</tspan><tspan dx="18">book_id : INT</tspan></text>
<text x="630" y="585" class="field">issue_date : DATE</text>
<text x="630" y="640" class="field">due_date : DATE</text>
<text x="630" y="695" class="field">return_date : DATE (NULL)</text>

<!-- BOOKS -->
<g filter="url(#shadow)">
<rect x="1090" y="300" width="420" height="455" rx="22" fill="url(#book)" stroke="#ffc75b" stroke-width="4"/>
<path d="M1112 300 H1488 Q1510 300 1510 322 V390 H1090 V322 Q1090 300 1112 300Z" fill="#a66d17"/>
<text x="1300" y="357" text-anchor="middle" class="entity">BOOKS</text>
</g>
<text x="1130" y="450" class="field"><tspan class="key">PK</tspan><tspan dx="18">book_id : INT</tspan></text>
<text x="1130" y="505" class="field">title : VARCHAR(150)</text>
<text x="1130" y="560" class="field">author : VARCHAR(100)</text>
<text x="1130" y="615" class="field">category : VARCHAR(100)</text>
<text x="1130" y="670" class="field">price : DECIMAL(10,2)</text>
<text x="1130" y="725" class="field">copies_available : INT</text>

<!-- Relationships -->
<path d="M510 485 H585" fill="none" stroke="#dcecff" stroke-width="5" marker-end="url(#arrow)"/>
<text x="548" y="455" text-anchor="middle" class="relation">1 : N</text>
<path d="M1090 525 H1015" fill="none" stroke="#dcecff" stroke-width="5" marker-end="url(#arrow)"/>
<text x="1052" y="495" text-anchor="middle" class="relation">1 : N</text>

<!-- Explanation -->
<rect x="130" y="850" width="1340" height="170" rx="26" fill="#102f5b" stroke="#55b7ff" stroke-width="3" filter="url(#shadow)"/>
<text x="800" y="920" text-anchor="middle" class="note">One member can have many issue records. One book can appear in many issue records.</text>
<text x="800" y="970" text-anchor="middle" class="note">ISSUES connects MEMBERS and BOOKS through member_id and book_id foreign keys.</text>
</svg>